server {
    listen 8080;
    server_name community.meshbox.co.uk;
    root /opt/meshbox-community/community-site;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    # Live status/dashboard demo data from this VM's local Community Agent.
    location /demo-agent/ {
        proxy_pass http://127.0.0.1:9876/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
